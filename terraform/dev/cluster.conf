# Rancher connection
rancher_api_url  = "https://localhost:8443"
rancher_token    = "token-5vgm5:rzthrqmbcd9x2f2sdqzj997nsf4bdp5gxr98g79zv52zqndwn9mvtb" # Get from Rancher UI
rancher_insecure = true

# Cluster configuration
cluster_name       = "dev-rke2"
kubernetes_version = "v1.32.8+rke2r1"

# Node configuration (optimized for local dev)
control_plane_count = 1 # 1 CP for dev (3 for HA/production)
worker_count        = 2 # 2 workers for dev

# Multipass VM configuration
multipass_cpu    = 2       # CPUs per VM
multipass_memory = "4G"    # Memory per VM
multipass_disk   = "50G"   # Disk per VM
multipass_image  = "22.04" # Ubuntu image (ARM64 compatible)

# Networking
enable_network_policy = true
cni                   = "calico" # Options: canal, calico, cilium

# Monitoring
enable_monitoring = true

# Tags
cluster_tags = {
  environment = "dev"
  managed_by  = "bash"
  team        = "platform"
}
