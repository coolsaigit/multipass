{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: {{ .Values.namespace }}
  labels:
    app: redpanda-console
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: redpanda-console
{{- end }}

