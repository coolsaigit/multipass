apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: {{ .Values.namespace }}
  labels:
    app: redpanda
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  serviceName: redpanda
  replicas: {{ .Values.redpanda.replicas }}
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      initContainers:
      - name: config-generator
        image: busybox:latest
        command: ['sh', '/etc/redpanda/generate-config.sh']
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          value: {{ .Values.namespace }}
        volumeMounts:
        - name: config
          mountPath: /etc/redpanda
      containers:
      - name: redpanda
        image: "{{ .Values.redpanda.image.repository }}:{{ .Values.redpanda.image.tag }}"
        imagePullPolicy: {{ .Values.redpanda.image.pullPolicy }}
        command:
        - /opt/redpanda/bin/redpanda
        args:
        - --redpanda-cfg
        - /etc/redpanda/redpanda.yaml
        - --smp
        - "1"
        - --memory
        - "512M"
        - --default-log-level=info
        - --overprovisioned
        - --unsafe-bypass-fsync=true
        - --lock-memory=false
        - --reserve-memory=0M
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 9092
          name: kafka-int
        - containerPort: 19092
          name: kafka-ext
        - containerPort: 8081
          name: schema-int
        - containerPort: 18081
          name: schema-ext
        - containerPort: 8082
          name: proxy-int
        - containerPort: 18082
          name: proxy-ext
        - containerPort: 9644
          name: admin
        - containerPort: 33145
          name: rpc
        volumeMounts:
        - name: config
          mountPath: /etc/redpanda
        {{- if .Values.redpanda.persistence.enabled }}
        - name: data
          mountPath: /var/lib/redpanda/data
        {{- end }}
        resources:
          {{- toYaml .Values.redpanda.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: redpanda-config
  {{- if .Values.redpanda.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - {{ .Values.redpanda.persistence.accessMode }}
      {{- if .Values.redpanda.persistence.storageClass }}
      storageClassName: {{ .Values.redpanda.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.redpanda.persistence.size }}
  {{- end }}

