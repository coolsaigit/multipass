apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: {{ .Values.namespace }}
  labels:
    app: redpanda
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  serviceName: redpanda
  replicas: {{ .Values.redpanda.replicas }}
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: "{{ .Values.redpanda.image.repository }}:{{ .Values.redpanda.image.tag }}"
        imagePullPolicy: {{ .Values.redpanda.image.pullPolicy }}
        command:
        - /usr/bin/rpk
        args:
        - redpanda
        - start
        - --kafka-addr
        - internal://0.0.0.0:9092,external://0.0.0.0:19092
        - --advertise-kafka-addr
        - internal://redpanda-$(POD_NAME).{{ .Values.namespace }}.svc.cluster.local:9092,external://redpanda-$(POD_NAME).{{ .Values.namespace }}.svc.cluster.local:19092
        - --pandaproxy-addr
        - internal://0.0.0.0:8082,external://0.0.0.0:18082
        - --advertise-pandaproxy-addr
        - internal://redpanda-$(POD_NAME).{{ .Values.namespace }}.svc.cluster.local:8082,external://redpanda-$(POD_NAME).{{ .Values.namespace }}.svc.cluster.local:18082
        - --schema-registry-addr
        - internal://0.0.0.0:8081,external://0.0.0.0:18081
        - --rpc-addr
        - 0.0.0.0:33145
        - --advertise-rpc-addr
        - redpanda-$(POD_NAME).{{ .Values.namespace }}.svc.cluster.local:33145
        - --smp
        - "1"
        - --memory
        - "512M"
        - --mode
        - dev-container
        - --default-log-level=info
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 9092
          name: kafka-int
        - containerPort: 19092
          name: kafka-ext
        - containerPort: 8081
          name: schema-int
        - containerPort: 18081
          name: schema-ext
        - containerPort: 8082
          name: proxy-int
        - containerPort: 18082
          name: proxy-ext
        - containerPort: 9644
          name: admin
        - containerPort: 33145
          name: rpc
        volumeMounts:
        {{- if .Values.redpanda.persistence.enabled }}
        - name: data
          mountPath: /var/lib/redpanda/data
        {{- end }}
        resources:
          {{- toYaml .Values.redpanda.resources | nindent 10 }}
  {{- if .Values.redpanda.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - {{ .Values.redpanda.persistence.accessMode }}
      {{- if .Values.redpanda.persistence.storageClass }}
      storageClassName: {{ .Values.redpanda.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.redpanda.persistence.size }}
  {{- end }}

