# Redpanda Operator CRD values
# Uses Redpanda Operator (installed separately) to manage the cluster
# Documentation: https://docs.redpanda.com/current/deploy/redpanda/kubernetes/k-production-deployment/

namespace: redpanda

# Image configuration
image:
  tag: v25.2.11

# StatefulSet configuration
statefulset:
  replicas: 1

# Resource configuration
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1Gi

# Storage configuration
storage:
  persistentVolume:
    enabled: true
    size: 20Gi

# Redpanda configuration
config:
  node:
    developer_mode: true

# Console configuration
console:
  enabled: true
