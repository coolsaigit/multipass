# Wrapper chart values for official Redpanda Helm chart
# Official chart: https://charts.redpanda.com
# Documentation: https://docs.redpanda.com/current/deploy/redpanda/kubernetes/k-production-deployment/

namespace: redpanda

# Official Redpanda chart configuration
# The official chart handles cluster formation, seed servers, and all configuration automatically

# Image configuration
image:
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: v25.2.11

# StatefulSet configuration
statefulset:
  replicas: 1

# Resource configuration
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1Gi

# Storage configuration
storage:
  persistentVolume:
    enabled: true
    size: 20Gi

# Redpanda configuration
config:
  node:
    developer_mode: true
    empty_seed_starts_cluster: true

# Console configuration
console:
  enabled: true

# TLS disabled for dev
tls:
  enabled: false

# Auth disabled for dev
auth:
  sasl:
    enabled: false

# External connectivity disabled
external:
  enabled: false
