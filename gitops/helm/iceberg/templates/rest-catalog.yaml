{{- if .Values.restCatalog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-catalog
  namespace: {{ .Values.namespace }}
  labels:
    app: rest-catalog
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.restCatalog.replicas }}
  selector:
    matchLabels:
      app: rest-catalog
  template:
    metadata:
      labels:
        app: rest-catalog
    spec:
      containers:
      - name: rest-catalog
        image: "{{ .Values.restCatalog.image.repository }}:{{ .Values.restCatalog.image.tag }}"
        imagePullPolicy: {{ .Values.restCatalog.image.pullPolicy }}
        ports:
        - containerPort: 8181
          name: http
        env:
        - name: CATALOG_WAREHOUSE
          value: "{{ .Values.restCatalog.env.warehouse }}"
        - name: CATALOG_IO__IMPL
          value: "org.apache.iceberg.aws.s3.S3FileIO"
        - name: CATALOG_S3_ENDPOINT
          value: "{{ .Values.restCatalog.env.s3Endpoint }}"
        - name: CATALOG_S3_ACCESS_KEY_ID
          value: "{{ .Values.restCatalog.env.s3AccessKey }}"
        - name: CATALOG_S3_SECRET_ACCESS_KEY
          value: "{{ .Values.restCatalog.env.s3SecretKey }}"
        - name: CATALOG_S3_PATH_STYLE_ACCESS
          value: "{{ .Values.restCatalog.env.s3PathStyleAccess }}"
        resources:
          {{- toYaml .Values.restCatalog.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rest-catalog
  namespace: {{ .Values.namespace }}
  labels:
    app: rest-catalog
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: ClusterIP
  ports:
  - port: 8181
    targetPort: 8181
    name: http
  selector:
    app: rest-catalog
{{- end }}

