{{- if .Values.trino.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ .Values.namespace }}
data:
  node.properties: |
    node.environment=production
    node.data-dir=/tmp/trino-data
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://trino.{{ .Values.namespace }}:8080
    query.max-memory={{ .Values.trino.config.queryMaxMemory }}
    query.max-memory-per-node={{ .Values.trino.config.queryMaxMemoryPerNode }}
  jvm.config: |
    -server
    -Xmx{{ .Values.trino.config.jvmHeapSize }}
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
  log.properties: |
    io.trino=INFO
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://rest-catalog.{{ .Values.namespace }}:8181
    iceberg.warehouse={{ .Values.restCatalog.env.warehouse }}
    iceberg.s3.endpoint={{ .Values.restCatalog.env.s3Endpoint }}
    iceberg.s3.path-style-access={{ .Values.restCatalog.env.s3PathStyleAccess }}
    iceberg.s3.aws-access-key={{ .Values.restCatalog.env.s3AccessKey }}
    iceberg.s3.aws-secret-key={{ .Values.restCatalog.env.s3SecretKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: {{ .Values.namespace }}
  labels:
    app: trino
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.trino.replicas }}
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      initContainers:
      - name: install-iceberg
        image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
        imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Installing Iceberg connector..."
          PLUGIN_DIR="/usr/lib/trino/plugin"
          ICEBERG_PLUGIN_DIR="${PLUGIN_DIR}/iceberg"
          mkdir -p "${ICEBERG_PLUGIN_DIR}"
          
          # Get Trino version
          TRINO_VERSION=$(trino --version 2>/dev/null | grep -oP 'version \K[0-9.]+' || echo "478")
          echo "Trino version: ${TRINO_VERSION}"
          
          # Check if Iceberg connector already exists in the image
          # Modern Trino images (478+) include Iceberg connector by default
          if [ -d "${ICEBERG_PLUGIN_DIR}" ] && [ "$(ls -A ${ICEBERG_PLUGIN_DIR} 2>/dev/null)" ]; then
            echo "Iceberg connector already exists in image - copying to shared volume..."
            cp -r "${ICEBERG_PLUGIN_DIR}"/* "${ICEBERG_PLUGIN_DIR}/" 2>/dev/null || true
            echo "Iceberg connector ready."
          else
            echo "Warning: Iceberg connector not found in image."
            echo "Trino 478+ should include Iceberg connector by default."
            echo "If errors persist, consider using a Trino image with Iceberg pre-installed."
          fi
        volumeMounts:
        - name: plugins
          mountPath: /usr/lib/trino/plugin
      containers:
      - name: trino
        image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
        imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/trino
        - name: catalog
          mountPath: /etc/trino/catalog
        - name: plugins
          mountPath: /usr/lib/trino/plugin
        resources:
          {{- toYaml .Values.trino.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: trino-config
      - name: catalog
        configMap:
          name: trino-config
          items:
          - key: iceberg.properties
            path: iceberg.properties
      - name: plugins
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: {{ .Values.namespace }}
  labels:
    app: trino
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: trino
{{- end }}

