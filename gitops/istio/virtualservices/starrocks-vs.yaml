apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: starrocks
  namespace: dev
spec:
  hosts:
    - starrocks.local
    - starrocks
  gateways:
    - istio-system/multipass-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: starrocks-fe.dev.svc.cluster.local
            port:
              number: 8030

