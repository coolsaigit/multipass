apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: flink
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: dev
            valuesFile: ../../kustomize/overlays/dev/flink/values-dev.yaml
          - environment: test
            namespace: test
            valuesFile: ../../kustomize/overlays/test/flink/values-test.yaml
          - environment: staging
            namespace: staging
            valuesFile: ../../kustomize/overlays/staging/flink/values-staging.yaml
          - environment: prod
            namespace: prod
            valuesFile: ../../kustomize/overlays/prod/flink/values-prod.yaml
  template:
    metadata:
      name: flink-{{environment}}
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: multipass
      source:
        repoURL: https://github.com/coolsaigit/multipass.git
        targetRevision: main
        path: gitops/helm/flink
        helm:
          valueFiles:
            - values.yaml
            - "{{valuesFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

