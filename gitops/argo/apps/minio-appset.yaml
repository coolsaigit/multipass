apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: minio
            valuesFile: gitops/kustomize/overlays/dev/minio/values-dev.yaml
            prune: true
          - environment: staging
            namespace: minio
            valuesFile: gitops/kustomize/overlays/staging/minio/values-staging.yaml
            prune: true
          - environment: prod
            namespace: minio
            valuesFile: gitops/kustomize/overlays/prod/minio/values-prod.yaml
            prune: false
  template:
    metadata:
      name: minio-{{environment}}
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: multipass
      source:
        repoURL: https://github.com/coolsaigit/multipass.git
        targetRevision: main
        path: gitops/helm/minio
        helm:
          valueFiles:
            - values.yaml
            - "{{valuesFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: "{{prune}}"
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

