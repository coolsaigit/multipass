# Development environment overrides for Flink Helm chart
namespace: flink

jobmanager:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

taskmanager:
  replicas: 1
  taskSlots: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

parallelism:
  default: 2

