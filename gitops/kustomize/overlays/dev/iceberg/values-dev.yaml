# Development environment overrides for Iceberg Helm chart
namespace: dev

restCatalog:
  env:
    s3Endpoint: "http://minio.dev:9000"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

trino:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    queryMaxMemory: "1GB"
    queryMaxMemoryPerNode: "150MB"
    jvmHeapSize: "512M"
