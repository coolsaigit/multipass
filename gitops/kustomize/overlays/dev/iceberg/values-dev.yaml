# Development environment overrides for Iceberg Helm chart
namespace: iceberg

restCatalog:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

trino:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    queryMaxMemory: "1GB"
    queryMaxMemoryPerNode: "500MB"
    jvmHeapSize: "512M"
