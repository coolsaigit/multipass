# Development environment overrides for Redpanda Helm chart
namespace: dev

# StatefulSet configuration for dev
statefulset:
  replicas: 3

# Resource configuration for dev
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1Gi

# Storage configuration for dev
storage:
  persistentVolume:
    enabled: true
    size: 10Gi

# Configuration for dev
config:
  node:
    developer_mode: true
    empty_seed_starts_cluster: false

# Console configuration for dev
console:
  enabled: true
