# Development environment overrides for Redpanda Helm chart
# Using official Helm chart from https://charts.redpanda.com
# Documentation: https://docs.redpanda.com/current/deploy/redpanda/kubernetes/k-production-deployment/

# Image configuration
image:
  tag: v25.2.11

# StatefulSet configuration
statefulset:
  replicas: 3

# Resource configuration
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1Gi

# Storage configuration
storage:
  persistentVolume:
    enabled: true
    size: 10Gi

# Redpanda configuration
config:
  node:
    developer_mode: true

# Configure listeners - disable external to prevent malformed hostnames
# The Helm chart creates 'internal' and 'default' (external) listeners by default
# We need to disable the external/default listener for each API
# Also disable TLS at listener level to prevent certificate mounts
listeners:
  kafka:
    port: 9093
    tls:
      enabled: false
    external:
      default:
        enabled: false
  admin:
    port: 9644
    tls:
      enabled: false
    external:
      default:
        enabled: false
  http:
    enabled: true
    port: 8082
    tls:
      enabled: false
    external:
      default:
        enabled: false
  schemaRegistry:
    enabled: true
    port: 8081
    tls:
      enabled: false
    external:
      default:
        enabled: false
  rpc:
    port: 33145
    tls:
      enabled: false

# TLS is disabled - the chart enables TLS by default and uses cert-manager
# We disable it for dev environment
tls:
  enabled: false

# Console configuration
console:
  enabled: true
  config:
    kafka:
      brokers:
        - redpanda.dev.svc.cluster.local:9093
      # Use only the internal listener, ignore external/default listener
      brokerListener: internal
    schemaRegistry:
      enabled: true
      urls:
        - http://redpanda.dev.svc.cluster.local:8081
