# Development environment overrides for Redpanda Operator CRD
namespace: dev

# StatefulSet configuration for dev
statefulset:
  replicas: 3

# Resource configuration for dev
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1Gi

# Storage configuration for dev
storage:
  persistentVolume:
    enabled: true
    size: 10Gi

# Configuration for dev
config:
  node:
    developer_mode: true

# Console configuration for dev
console:
  enabled: true
