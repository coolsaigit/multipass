apiVersion: v1
kind: Namespace
metadata:
  name: redpanda
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: redpanda
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:latest
        command:
        - /usr/bin/rpk
        args:
        - redpanda
        - start
        - --kafka-addr
        - internal://0.0.0.0:9092,external://0.0.0.0:19092
        - --advertise-kafka-addr
        - internal://redpanda:9092,external://localhost:19092
        - --pandaproxy-addr
        - internal://0.0.0.0:8082,external://0.0.0.0:18082
        - --advertise-pandaproxy-addr
        - internal://redpanda:8082,external://localhost:18082
        - --schema-registry-addr
        - internal://0.0.0.0:8081,external://0.0.0.0:18081
        - --rpc-addr
        - 0.0.0.0:33145
        - --advertise-rpc-addr
        - redpanda:33145
        - --smp
        - "1"
        - --memory
        - "1G"
        - --mode
        - dev-container
        - --default-log-level=info
        ports:
        - containerPort: 9092
          name: kafka-int
        - containerPort: 19092
          name: kafka-ext
        - containerPort: 8081
          name: schema-int
        - containerPort: 18081
          name: schema-ext
        - containerPort: 8082
          name: proxy-int
        - containerPort: 18082
          name: proxy-ext
        - containerPort: 9644
          name: admin
        - containerPort: 33145
          name: rpc
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redpanda-data
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: redpanda
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka-internal
  - port: 19092
    targetPort: 19092
    name: kafka-external
  - port: 8081
    targetPort: 8081
    name: schema-registry-internal
  - port: 18081
    targetPort: 18081
    name: schema-registry-external
  - port: 8082
    targetPort: 8082
    name: pandaproxy-internal
  - port: 18082
    targetPort: 18082
    name: pandaproxy-external
  - port: 9644
    targetPort: 9644
    name: admin
  - port: 33145
    targetPort: 33145
    name: rpc
  selector:
    app: redpanda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
      - name: redpanda-console
        image: docker.redpanda.com/redpandadata/console:latest
        env:
        - name: KAFKA_BROKERS
          value: "redpanda:9092"
        - name: KAFKA_SCHEMAREGISTRY_ENABLED
          value: "true"
        - name: KAFKA_SCHEMAREGISTRY_URLS
          value: "http://redpanda:8081"
        - name: KAFKA_PRODUCER_ENABLED
          value: "true"
        - name: KAFKA_CONSUMER_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: redpanda
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: redpanda-console

