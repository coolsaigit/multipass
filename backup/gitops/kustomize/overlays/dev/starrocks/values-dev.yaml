# Development environment overrides for StarRocks Helm chart
namespace: dev

frontend:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    size: 10Gi

backend:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    size: 20Gi

