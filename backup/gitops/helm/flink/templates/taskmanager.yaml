apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: {{ .Values.namespace }}
  labels:
    app: flink
    component: taskmanager
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.taskmanager.replicas }}
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
      - name: taskmanager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["taskmanager"]
        ports:
        - containerPort: 6122
          name: data
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager
            taskmanager.numberOfTaskSlots: {{ .Values.taskmanager.taskSlots }}
            parallelism.default: {{ .Values.parallelism.default }}
        resources:
          {{- toYaml .Values.taskmanager.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager
  namespace: {{ .Values.namespace }}
  labels:
    app: flink
    component: taskmanager
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - port: 6122
    targetPort: 6122
    name: data
  selector:
    app: flink
    component: taskmanager

