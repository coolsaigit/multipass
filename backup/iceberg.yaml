apiVersion: v1
kind: Namespace
metadata:
  name: iceberg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: iceberg
data:
  node.properties: |
    node.environment=production
    node.data-dir=/tmp/trino-data
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=1GB
  jvm.config: |
    -server
    -Xmx1G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
  log.properties: |
    io.trino=INFO
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://rest-catalog.iceberg:8181
    iceberg.warehouse=s3://iceberg-warehouse/
    iceberg.s3.endpoint=http://minio.minio:9000
    iceberg.s3.path-style-access=true
    iceberg.s3.aws-access-key=minioadmin
    iceberg.s3.aws-secret-key=minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
      - name: trino
        image: trinodb/trino:latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/trino
        - name: catalog
          mountPath: /etc/trino/catalog
      volumes:
      - name: config
        configMap:
          name: trino-config
      - name: catalog
        configMap:
          name: trino-config
          items:
          - key: iceberg.properties
            path: iceberg.properties
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: iceberg
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: trino
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-catalog
  namespace: iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-catalog
  template:
    metadata:
      labels:
        app: rest-catalog
    spec:
      containers:
      - name: rest-catalog
        image: tabulario/iceberg-rest:latest
        ports:
        - containerPort: 8181
          name: http
        env:
        - name: CATALOG_WAREHOUSE
          value: "s3://iceberg-warehouse/"
        - name: CATALOG_IO__IMPL
          value: "org.apache.iceberg.aws.s3.S3FileIO"
        - name: CATALOG_S3_ENDPOINT
          value: "http://minio.minio:9000"
        - name: CATALOG_S3_ACCESS_KEY_ID
          value: "minioadmin"
        - name: CATALOG_S3_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: CATALOG_S3_PATH_STYLE_ACCESS
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: rest-catalog
  namespace: iceberg
spec:
  type: ClusterIP
  ports:
  - port: 8181
    targetPort: 8181
    name: http
  selector:
    app: rest-catalog

