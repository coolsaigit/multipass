apiVersion: v1
kind: Namespace
metadata:
  name: iceberg
---
# Iceberg REST Catalog (manages table metadata)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-catalog
  namespace: iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-catalog
  template:
    metadata:
      labels:
        app: rest-catalog
    spec:
      containers:
      - name: rest-catalog
        image: tabulario/iceberg-rest:latest
        ports:
        - containerPort: 8181
          name: http
        env:
        - name: CATALOG_WAREHOUSE
          value: "s3://iceberg-warehouse/"
        - name: CATALOG_IO__IMPL
          value: "org.apache.iceberg.aws.s3.S3FileIO"
        - name: CATALOG_S3_ENDPOINT
          value: "http://minio.minio:9000"
        - name: CATALOG_S3_ACCESS_KEY_ID
          value: "minioadmin"
        - name: CATALOG_S3_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: CATALOG_S3_PATH_STYLE_ACCESS
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: rest-catalog
  namespace: iceberg
spec:
  type: ClusterIP
  ports:
  - port: 8181
    targetPort: 8181
    name: http
  selector:
    app: rest-catalog

